[package]
name = "llmstatus"
version = "0.2.0"
description = "Local-only coding CLI usage dashboard"
authors = ["Oki Sugiyama"]
license = "MIT"
publish = false
repository = "https://github.com/OkiSugiyama/LLMStatus"
edition = "2021"
rust-version = "1.77.2"
default-run = "llmstatus"

[lib]
name = "llmstatus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "llmstatus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"
which = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
